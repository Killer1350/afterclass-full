<style>

argin-top:14px}.formgrid label{font-size:12px;font-weight:700}.formgrid input{display:block;width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-top:6px;outline-color:var(--green)}.hint{font-size:11px;color:var(--muted);font-weight:400}.checkout{width:100%;height:46px;border:0;border-radius:11px;background:var(--green);color:white;font-weight:700;margin-top:16px}.checkout:disabled{opacity:.4;cursor:not-allowed}.validation{font-size:12px;color:#a85431;min-height:15px;margin:0}.success{background:#e5f3eb;padding:13px;border-radius:12px;color:var(--green);font-size:13px;line-height:1.5}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18352e;color:#fff;padding:12px 17px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:5}.foot{border-top:1px solid var(--line);padding:20px 0 28px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.api-state{font-size:11px;color:var(--muted)}.receipt{background:#f8faf7;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}.receipt h3{font:700 16px Manrope;margin:0 0 10px}.receipt-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}.receipt-row:last-child{border-bottom:0}.download{width:100%;height:44px;border:1px solid var(--green);border-radius:10px;background:#fff;color:var(--green);font-weight:700;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero-card{min-height:130px}.cart-layout{grid-template-columns:1fr}}@media(max-width:800px){.contact-layout{grid-template-columns:1fr}.contact-layout>section[style*="grid-column"]{grid-column:auto!important}.contact-photo{min-height:260px}}@media(max-width:540px){.shell{padding:0 17px}.nav{gap:0}.nav button{padding:9px 8px;font-size:12px}.nav .cart{min-width:0}.hero-card{min-height:230px}.top{height:68px}.brand{font-size:20px}.nav button{padding:10px}.nav .cart{min-width:0}.hero{padding:40px 0 26px;gap:20px}.controls{align-items:flex-start;flex-direction:column}.control-right{width:100%}.search{flex:1;width:auto}.sort{flex:1;min-width:0}.grid{grid-template-columns:1fr;gap:12px}.pagehead h1{font-size:34px}.panel{padding:17px}.cart-row{gap:10px;grid-template-columns:1fr auto}.cart-row .remove{grid-column:2;grid-row:1}.cart-row .price{grid-column:1}.foot{gap:10px;flex-direction:column}}

/* Refined navigation and Explore layout */
.top{background:#143f35;color:#fff;border:0;box-shadow:0 8px 24px #18352e18;margin-left:calc((1124px - 100vw)/2);margin-right:calc((1124px - 100vw)/2);padding-left:max(28px,calc((100vw - 1124px)/2));padding-right:max(28px,calc((100vw - 1124px)/2))}
.brand{color:#fff}.brand-mark{background:#f0a777;color:#143f35}
.nav button{color:#f2f7f3;transition:background .18s,color .18s}.nav button:hover{background:#ffffff19}.nav button.active{background:#ffffff20;color:#fff}.nav .cart{background:#f0a777;color:#173d34}.nav .cart:hover{background:#ffc094}
.hero{margin:28px 0 30px;padding:36px 38px;background:#e7f1e9;border:1px solid #d9e7dc;border-radius:26px;grid-template-columns:1.15fr .85fr;gap:42px}.hero h1{max-width:590px}.hero-card{min-height:280px}

@media(max-width:600px){.top{margin-left:-17px;margin-right:-17px;padding-left:17px;padding-right:17px}.hero{margin:18px 0 22px;padding:23px 19px;border-radius:20px;grid-template-columns:1fr;gap:19px}.hero h1{font-size:clamp(36px,10vw,48px);letter-spacing:-1.8px}.hero-card{min-height:220px}.controls{padding:14px;border-radius:15px}.controls h2{font-size:19px}.control-right{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:8px}.search{grid-column:1/-1}.sort{font-size:13px;padding:0 9px}.direction{width:44px}.nav button{padding:9px 8px;font-size:12px}.nav .cart{min-width:0}.brand{font-size:19px}.brand-mark{width:29px;height:29px}}

<body><div id="app">
<div class="shell"><header class="top"><div class="brand"><img class="brand-mark" src="assets/afterclass-mark.svg" alt="" aria-hidden="true">afterclass</div><nav class="nav" aria-label="Main navigation"><button :class="{active:!showCart&&!showContact}" @click="showCart=false;showContact=false">Explore</button><button :class="{active:showContact}" @click="showCart=false;showContact=true">Contact</button><button class="cart" :disabled="cartCount===0&&!showCart" @click="showCart=!showCart;showContact=false">{{showCart?'← Lessons':'Bag · '+cartCount}}</button></nav></header>
<template v-if="!showCart&&!showContact"><section class="hero"><div><div class="eyebrow">A little more after the bell</div><h1>Make room for<br>something new.</h1><p>From first goals to new passions, find a class that makes the school day even better.</p></div><div class="hero-card"><img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=1100&q=85" alt="Children enjoying a creative activity"><span>Good things happen after school</span><strong>Find their next favourite thing.</strong></div></section><section class="controls"><h2>Explore classes <span style="color:#8a9a90">({{filteredLessons.length}})</span></h2><div class="control-right"><input class="search" v-model="query" @input="refreshLessons" placeholder="Search classes…" aria-label="Search lessons"><select class="sort" v-model="selectedTeacher" @change="refreshLessons" aria-label="Filter by teacher"><option value="">All teachers</option><option v-for="teacher in teachers" :key="teacher.firstName+teacher.lastName" :value="teacher.firstName+'|'+teacher.lastName">{{teacher.firstName}} {{teacher.lastName}}</option></select><select class="sort" v-model="sortBy" aria-label="Sort lessons"><option value="topic">Sort: subject</option><option value="location">Sort: location</option><option value="price">Sort: price</option><option value="space">Sort: spaces</option></select><button class="direction" @click="descending=!descending" :aria-label="descending?'Descending':'Ascending'">{{descending?'↓':'↑'}}</button></div></section><div class="grid"><article class="card" v-for="lesson in filteredLessons" :key="lesson._id"><div class="cardtop"><div class="icon" style="overflow:hidden"><img v-if="lesson.image" :src="apiBaseUrl+'/images/'+lesson.image" :alt="lesson.topic+' illustration'" style="width:100%;height:100%;object-fit:cover"><img v-else :src="imageFor(lesson)" :alt="lesson.topic+' class'" style="width:100%;height:100%;object-fit:cover"></div><div class="price">£{{lesson.price}} <small>/ class</small></div></div><h3>{{lesson.topic}}</h3><div class="place">⌖ {{lesson.location}}</div><div class="place" style="margin-top:8px">✦ {{(lesson.teachers||[]).map(t=>t.firstName+' '+t.lastName).join(', ')||'Class team'}} · {{enrolments[lesson._id]??0}} enrolled</div><div class="cardfoot"><span class="availability">{{lesson.space}} {{lesson.space===1?'space':'spaces'}} left</span><button class="add" :disabled="lesson.space===0" @click="addToCart(lesson)">{{lesson.space===0?'Full':'Add to bag'}}</button></div></article><div v-if="!filteredLessons.length" class="empty">No classes match that search. Try another word.</div></div></template>
<template v-else-if="showContact"><section class="pagehead"><div class="eyebrow">We’re here to help</div><h1>Let’s talk after class.</h1><p style="color:#697b73;margin:0">Questions about a class or booking? Send our team a note.</p></section><div class="contact-layout"><section class="panel"><h2>Get in touch</h2><p style="color:#697b73;line-height:1.65">We’re happy to help families find the right after-school activity.</p><div class="contact-details"><div><b>Email</b><span>hello@afterclass.club</span></div><div><b>Service area</b><span>North London and nearby communities</span></div><div><b>When we reply</b><span>Usually within one working day</span></div></div></section><div class="contact-photo"><img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=1100&q=85" alt="A parent spending time with a child"><strong>A little support goes a long way.</strong></div><section class="panel" style="grid-column:1/-1"><h2>Send us a message</h2><div v-if="contactSubmitted" class="contact-success" role="status">Thanks, {{contactName}}. Your message is ready for our team. This demo form does not send or store messages yet.</div><form v-else class="contact-form" @submit.prevent="submitContact"><label>Your name<input v-model="contactName" required autocomplete="name" placeholder="e.g. Alex Morgan"></label><label>Email address<input v-model="contactEmail" required type="email" autocomplete="email" placeholder="you@example.com"></label><label>How can we help?<textarea v-model="contactMessage" required placeholder="Tell us a little about your question"></textarea></label><button type="submit">Prepare message</button></form></section></div></template><template v-else><section class="pagehead"><div class="eyebrow">Your picks</div><h1>Your class bag</h1><p style="color:#697b73;margin:0">A great after-school plan is taking shape.</p></section><div class="cart-layout"><section class="panel"><h2>Selected classes <span style="color:#8a9a90">({{cartCount}})</span></h2><div v-if="!cart.length" class="empty" style="padding:35px 10px">Your bag is empty. Explore classes to add one.</div><div v-for="item in cart" :key="item.lesson._id" class="cart-row"><div><strong>{{item.lesson.icon||'✦'}} {{item.lesson.topic}}</strong><small>{{item.lesson.location}} · Qty {{item.quantity}}</small></div><div class="price">£{{item.lesson.price*item.quantity}}</div><button class="remove" @click="removeFromCart(item)">Remove</button></div><div class="total"><span>Total</span><span>£{{total}}</span></div></section><aside class="panel"><h2>{{receipt?'Receipt':'Parent / guardian details'}}</h2><div v-if="orderMessage" class="success" role="status">✓ {{orderMessage}}</div><section v-if="receipt" class="receipt" aria-label="Order receipt"><h3>AfterClass receipt</h3><div class="receipt-row"><span>Order</span><strong>{{receipt.orderId}}</strong></div><div class="receipt-row"><span>Name</span><strong>{{receipt.name}}</strong></div><div class="receipt-row"><span>Date</span><strong>{{receipt.date}}</strong></div><div v-for="item in receipt.items" :key="item.id" class="receipt-row"><span>{{item.topic}} × {{item.quantity}}</span><strong>£{{item.lineTotal}}</strong></div><div class="receipt-row"><span>Total</span><strong>£{{receipt.total}}</strong></div><button class="download" type="button" @click="downloadReceipt">Download receipt</button></section><template v-if="!receipt"><div class="formgrid"><label>Name <span class="hint">(letters and spaces)</span><input v-model="name" autocomplete="name" placeholder="e.g. Alex Morgan"></label><label>Phone <span class="hint">(numbers only)</span><input v-model="phone" inputmode="numeric" autocomplete="tel" placeholder="e.g. 07123456789"></label><p class="validation" v-if="name&&!validName">Please use letters and spaces only.</p><p class="validation" v-if="phone&&!validPhone">Please enter numbers only.</p></div><button class="checkout" :disabled="!canCheckout" @click="submitOrder">Checkout</button></template><p class="hint" style="margin:10px 0 0">No payment processing is included in this coursework.</p></aside></div></template>
<footer class="foot"><span>AfterClass <span v-if="!apiConfigured">· demo mode</span></span><span class="api-state">{{apiConfigured?(apiOnline?'Connected to API':'API not connected'):'Vue coursework demo'}}</span></footer><div v-if="toast" class="notice" role="status">{{toast}}</div></div>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const {createApp}=Vue;
const API_BASE_URL='http://localhost:3000';
const demoLessons=[
 {_id:'demo-1',topic:'Creative coding',location:'Hendon',price:12,space:5,icon:'💻',teachers:[{firstName:'Amira',lastName:'Khan'}]},

 {_id:'demo-10',topic:'Young chefs',location:'Golders Green',price:17,space:5,icon:'🧑‍🍳',teachers:[{firstName:'Lily',lastName:'Chen'}]}

createApp({data(){return{lessons:[],cart:[],receipt:null,showCart:false,sortBy:'topic',descending:false,query:'',teachers:[],selectedTeacher:'',enrolments:{},name:'',phone:'',loading:true,apiConfigured:true,apiBaseUrl:API_BASE_URL,apiOnline:false,orderMessage:'',contactName:'',contactEmail:'',contactMessage:'',contactSubmitted:false,showContact:false,toast:'',toastTimer:null,searchTimer:null}},computed:{filteredLessons(){return this.lessons.slice().sort((a,b)=>{let x=a[this.sortBy],y=b[this.sortBy],c=typeof x==='number'?x-y:String(x??'').localeCompare(String(y??''));return this.descending?-c:c})},cartCount(){return this.cart.reduce((n,x)=>n+x.quantity,0)},total(){return this.cart.reduce((n,x)=>n+x.quantity*Number(x.lesson.price),0)},validName(){return /^[A-Za-z ]+$/.test(this.name.trim())},validPhone(){return /^\d+$/.test(this.phone.trim())},canCheckout(){return this.cart.length>0&&this.validName&&this.validPhone}},methods:{imageFor(lesson){const photos=['photo-1513364776144-60967b0f800f','photo-1475721027785-f74eccf877e2','photo-1516627145497-ae6968895b74','photo-1503454537195-1dcabb73ffb9'];let n=0;for(const c of String(lesson.topic||''))n=(n+c.charCodeAt(0))%photos.length;return 'https://images.unsplash.com/'+photos[n]+'?auto=format&fit=crop&w=500&q=80'},submitContact(){this.contactSubmitted=true},async refreshLessons(){clearTimeout(this.searchTimer);this.searchTimer=setTimeout(async()=>{try{const params=new URLSearchParams();if(this.query.trim())params.set('q',this.query.trim());if(this.selectedTeacher){const [firstName,lastName]=this.selectedTeacher.split('|');params.set('teacherFirstName',firstName);params.set('teacherLastName',lastName)}const r=await fetch(API_BASE_URL+'/search?'+params.toString());if(!r.ok)throw Error('Search request failed');this.lessons=await r.json();this.apiOnline=true;this.loadEnrolments()}catch(e){this.toast='Could not reach the API. Start the Express server and try again.'}},180)},async loadLessons(){try{const [r,teacherResponse]=awai
